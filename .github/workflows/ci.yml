name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Un seul run par ref : annule les runs obsolètes quand on repush.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Les macros sqlx::query! se compilent contre le cache `.sqlx/` committé,
  # jamais contre une DB live. Aucun DATABASE_URL requis en CI.
  SQLX_OFFLINE: "true"

jobs:
  # Gate rapide : formatage, lint, et suite de tests offline.
  check:
    name: fmt + clippy + tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain stable (+ rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (offline, #[ignore] exclus)
        # --test-threads=1 : HUSKER_DATA_ROOT/SOURCES_ROOT/LOGS_ROOT sont des env vars
        # globales au process ; routes/apps.rs lit HUSKER_DATA_ROOT sans le verrou
        # ENV_ROOTS_LOCK que deploy.rs utilise pour les muter -> race inter-tests en
        # parallèle (flaky, non reproductible en local). Coût négligeable (~2s de plus).
        run: cargo test -- --test-threads=1

  # E2E : pipeline réel (git + Docker). Ne tourne que si le gate rapide est vert.
  e2e:
    name: E2E (Docker)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test -- --ignored (deploy / stop / restart / pipeline_e2e)
        # Même race que le job `check` (voir son commentaire) : ces tests mutent les
        # mêmes env vars globales.
        run: cargo test -- --ignored --test-threads=1
